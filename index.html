<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forever</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-image: url('background.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      animation: pageFade 1.5s ease;
      padding: 20px;
    }

    @keyframes pageFade {
      from {
        opacity: 0;
        transform: scale(1.03);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Snow background */
    .snow {
      position: fixed;
      top: -10px;
      width: 10px;
      height: 10px;
      background: white;
      border-radius: 50%;
      opacity: 0.8;
      animation: fall linear infinite;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes fall {
      0% {
        transform: translateY(-10px);
        opacity: 0;
      }
      10% {
        opacity: 0.9;
      }
      100% {
        transform: translateY(110vh);
        opacity: 0.2;
      }
    }

    .container,
    .counter-box {
      position: relative;
      z-index: 2;
    }

    .container {
      width: 100%;
      max-width: 1400px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 80px;
      margin-bottom: 40px;
      flex-wrap: wrap;
      animation: floatUp 1.5s ease;
    }

    @keyframes floatUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .circle-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      animation: softFloat 4s ease-in-out infinite;
    }

    .circle-box:nth-child(1) {
      animation-delay: 0s;
    }

    .circle-box:nth-child(3) {
      animation-delay: 1s;
    }

    @keyframes softFloat {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    .circle {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: 5px solid #ff4d6d;
      box-shadow: 0 0 30px rgba(255, 77, 109, 0.35);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: 0.4s ease;
    }

    .circle:hover {
      transform: scale(1.06);
      box-shadow: 0 0 40px rgba(255, 255, 255, 0.35);
    }

    .circle1 {
      background-image: url('1.jpg');
    }

    .circle2 {
      background-image: url('2.jpg');
      border-color: #4da6ff;
      box-shadow: 0 0 30px rgba(77, 166, 255, 0.35);
    }

    .name {
      font-size: 34px;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(255,255,255,0.15);
      animation: fadeText 2s ease;
    }

    @keyframes fadeText {
      from {
        opacity: 0;
        letter-spacing: 8px;
      }
      to {
        opacity: 1;
        letter-spacing: 0;
      }
    }

    .mariam {
      color: #ff69b4;
    }

    .mohamed {
      color: #4da6ff;
    }

    .heart-wrapper {
      position: relative;
      width: 240px;
      height: 240px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .heart {
      position: relative;
      width: 170px;
      height: 170px;
      background: #ff1744;
      transform: rotate(-45deg);
      animation: pulse 1s infinite;
      box-shadow: 0 0 35px rgba(255, 23, 68, 0.6);
      z-index: 2;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 170px;
      height: 170px;
      background: #ff1744;
      border-radius: 50%;
    }

    .heart::before {
      top: -85px;
      left: 0;
    }

    .heart::after {
      left: 85px;
      top: 0;
    }

    @keyframes pulse {
      0% {
        transform: rotate(-45deg) scale(1);
      }
      50% {
        transform: rotate(-45deg) scale(1.12);
        box-shadow: 0 0 45px rgba(255, 23, 68, 0.9);
      }
      100% {
        transform: rotate(-45deg) scale(1);
      }
    }

    .mini-heart {
      position: absolute;
      width: 18px;
      height: 18px;
      background: rgba(255, 105, 180, 0.85);
      transform: rotate(-45deg);
      animation: flyHeart 3s linear infinite;
      z-index: 1;
    }

    .mini-heart::before,
    .mini-heart::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      background: rgba(255, 105, 180, 0.85);
      border-radius: 50%;
    }

    .mini-heart::before {
      top: -9px;
      left: 0;
    }

    .mini-heart::after {
      left: 9px;
      top: 0;
    }

    @keyframes flyHeart {
      0% {
        opacity: 0;
        transform: translateY(20px) rotate(-45deg) scale(0.5);
      }
      20% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translateY(-100px) rotate(-45deg) scale(1.2);
      }
    }

    .h1 { left: 25px; bottom: 40px; animation-delay: 0s; }
    .h2 { right: 25px; bottom: 30px; animation-delay: 1s; }
    .h3 { left: 50%; top: 20px; animation-delay: 2s; }

    .counter-box {
      text-align: center;
      color: white;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 22px 34px;
      border-radius: 22px;
      box-shadow: 0 0 25px rgba(255,255,255,0.08);
      backdrop-filter: blur(6px);
      animation: counterFade 2s ease;
      max-width: 95%;
    }

    @keyframes counterFade {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .counter-title {
      font-size: 28px;
      margin-bottom: 12px;
      color: #ffb6d9;
      font-weight: bold;
    }

    .counter {
      font-size: 34px;
      font-weight: bold;
      line-height: 1.8;
    }

    .counter span {
      color: #ff4d6d;
      text-shadow: 0 0 12px rgba(255, 77, 109, 0.6);
    }

    /* ========================= */
    /* Laptop / small desktop */
    /* ========================= */
    @media (max-width: 1200px) {
      .container {
        gap: 50px;
      }

      .circle {
        width: 190px;
        height: 190px;
      }

      .heart-wrapper {
        width: 200px;
        height: 200px;
      }

      .heart {
        width: 145px;
        height: 145px;
      }

      .heart::before,
      .heart::after {
        width: 145px;
        height: 145px;
      }

      .heart::before {
        top: -72px;
      }

      .heart::after {
        left: 72px;
      }

      .name {
        font-size: 28px;
      }

      .counter {
        font-size: 28px;
      }
    }

    /* ========================= */
    /* Tablet */
    /* ========================= */
    @media (max-width: 900px) {
      .container {
        gap: 30px;
      }

      .circle {
        width: 160px;
        height: 160px;
      }

      .heart-wrapper {
        width: 170px;
        height: 170px;
      }

      .heart {
        width: 120px;
        height: 120px;
      }

      .heart::before,
      .heart::after {
        width: 120px;
        height: 120px;
      }

      .heart::before {
        top: -60px;
      }

      .heart::after {
        left: 60px;
      }

      .name {
        font-size: 24px;
      }

      .counter-title {
        font-size: 22px;
      }

      .counter {
        font-size: 24px;
      }
    }

    /* ========================= */
    /* Mobile */
    /* ========================= */
    @media (max-width: 600px) {
      body {
        padding: 15px;
      }

      .container {
        flex-direction: column;
        gap: 22px;
        margin-bottom: 25px;
      }

      .circle-box {
        gap: 10px;
      }

      .circle {
        width: 130px;
        height: 130px;
        border-width: 3px;
      }

      .name {
        font-size: 22px;
      }

      .heart-wrapper {
        width: 130px;
        height: 130px;
      }

      .heart {
        width: 85px;
        height: 85px;
      }

      .heart::before,
      .heart::after {
        width: 85px;
        height: 85px;
      }

      .heart::before {
        top: -42px;
      }

      .heart::after {
        left: 42px;
      }

      .mini-heart {
        width: 12px;
        height: 12px;
      }

      .mini-heart::before,
      .mini-heart::after {
        width: 12px;
        height: 12px;
      }

      .mini-heart::before {
        top: -6px;
      }

      .mini-heart::after {
        left: 6px;
      }

      .counter-box {
        width: 100%;
        padding: 16px 14px;
        border-radius: 18px;
      }

      .counter-title {
        font-size: 18px;
      }

      .counter {
        font-size: 18px;
        line-height: 1.7;
      }
    }

    /* Very small phones */
    @media (max-width: 380px) {
      .circle {
        width: 110px;
        height: 110px;
      }

      .heart {
        width: 75px;
        height: 75px;
      }

      .heart::before,
      .heart::after {
        width: 75px;
        height: 75px;
      }

      .heart::before {
        top: -37px;
      }

      .heart::after {
        left: 37px;
      }

      .name {
        font-size: 20px;
      }

      .counter {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="circle-box">
      <div class="circle circle1"></div>
      <div class="name mariam">Mariam</div>
    </div>

    <div class="heart-wrapper">
      <div class="mini-heart h1"></div>
      <div class="mini-heart h2"></div>
      <div class="mini-heart h3"></div>
      <div class="heart"></div>
    </div>

    <div class="circle-box">
      <div class="circle circle2"></div>
      <div class="name mohamed">Mohamed</div>
    </div>
  </div>

  <div class="counter-box">
    <div class="counter-title">Together For</div>
    <div class="counter" id="counter"></div>
  </div>

  <script>
    // Snow effect
    for (let i = 0; i < 70; i++) {
      const snow = document.createElement("div");
      snow.classList.add("snow");
      snow.style.left = Math.random() * 100 + "vw";
      snow.style.width = snow.style.height = (Math.random() * 6 + 4) + "px";
      snow.style.animationDuration = (Math.random() * 6 + 5) + "s";
      snow.style.animationDelay = Math.random() * 5 + "s";
      snow.style.opacity = Math.random();
      document.body.appendChild(snow);
    }

    // Counter start: 255 days + 21 hours ago
    let startTime = new Date();
    startTime.setDate(startTime.getDate() - 255);
    startTime.setHours(startTime.getHours() - 21);

    function updateCounter() {
      let now = new Date();
      let diff = now - startTime;

      let days = Math.floor(diff / (1000 * 60 * 60 * 24));
      let hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      let minutes = Math.floor((diff / (1000 * 60)) % 60);
      let seconds = Math.floor((diff / 1000) % 60);

      document.getElementById("counter").innerHTML = `
        <span>${days}</span> Days 
        <span>${hours}</span> Hours 
        <span>${minutes}</span> Minutes 
        <span>${seconds}</span> Seconds
      `;
    }

    updateCounter();
    setInterval(updateCounter, 1000);
  </script>

</body>
</html>
